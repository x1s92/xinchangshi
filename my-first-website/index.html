<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
            background-color: #f0f0f0;
            color: #333;
        }
        h1 {
            color: #007bff;
        }
        p {
            font-size: 18px;
            line-height: 1.6;
        }
        img {
            max-width: 300px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>欢迎来到我的第一个网站！</h1>
    
    <p>我是 [xsh]，这是一个我自己从零开始做的简单网页。</p>
    
    <p>目前我还在学习中，这个网站只用了一个 index.html 文件。</p>
    
    <!-- 如果你有照片，可以把下面这行前面的 <!-- 和 --> 删掉，然后把 "你的照片.jpg" 改成你的图片文件名 -->
    <!-- <img src="你的照片.jpg" alt="我的照片"> -->
    
    <p>学长好！这是我的前端练习。</p>
    
    <p>技术栈：纯 HTML + CSS（样式写在 <style> 里面）</p>
</body>
</html>
